# 由 gen_pre_build_config 固化：linux/amd64
# 双环境策略见 env_strategy_note；本文件可手改后由工具 -validate 校验。

project:
  name: protenix_build
  version: v0.0.1

run_mode: release

target:
  goos: "linux"
  goarch: "amd64"

install_prefix: /opt/protenix_build

# 字段名沿用 host_capability；语义=目标运行栈（非「仅宿主锚点、产品降级」）
host_capability:
  cuda: "13"
  python_host_anchor: "3.14"
  node_lts: "24"
  product_python_min: "3.14"
  product_python_max: "3.14"
  product_python_preferred: "3.14"
  torch_cuda_in_prefix: "cu130"
  note: >
    目标运行栈：CUDA 13 / Python 3.14 / Node 24 LTS。
    交付：原生安装 + systemd；不以 Docker 为主路径。
    上游官方 install/torch pin 若尚未对齐 Python 3.14 或 CUDA 13，下一阶段收敛，不在此改写目标。

env_strategy: separate_prefix_envs
env_strategy_note: >
  protenix 与 pxdesign 必须两套独立 prefix 环境；仅二者依赖 Python；
  本仓编排走 Go + shell。目标栈以 host_capability（CUDA 13 / Python 3.14 / Node 24）为准。

products:
  - name: protenix
    src_path: build_srcs/protenix
    build_subdir: protenix
    service_unit: example_files/protenix.service
    oneshot_unit: example_files/protenix-oneshot.service
    env_file: example_files/protenix.env
    wrapper: example_files/protenix-run
    install_script: example_files/install_protenix.sh
    prefix_install_script: scripts/install_prefix_protenix.sh
    env_policy: latest_submodule
    torch_hint: "2.14.1+cu130"
    cli_name: protenix
    wrapper_name: protenix-run
    supervisor_bin: protenixd
    supervisor_cmd_path: cmd/protenixd
    systemd_type: oneshot
    product_python: "3.14"

  - name: pxdesign
    src_path: build_srcs/pxdesign
    build_subdir: pxdesign
    service_unit: example_files/pxdesign.service
    oneshot_unit: example_files/pxdesign-oneshot.service
    env_file: example_files/pxdesign.env
    wrapper: example_files/pxdesign-run
    install_script: example_files/install_pxdesign.sh
    prefix_install_script: scripts/install_prefix_pxdesign.sh
    env_policy: pinned_protenix_v0_5_0_pxd
    pinned_protenix_ref: v0.5.0+pxd
    torch_hint: "2.3.1"
    cli_name: pxdesign
    wrapper_name: pxdesign-run
    supervisor_bin: pxdesignd
    supervisor_cmd_path: cmd/pxdesignd
    systemd_type: oneshot
    product_python: "3.14"

paths:
  build_root: build
  upload_tmp_dir: build/upload_tmp_dir
  prefix_root: prefix
  example_files_dir: example_files
  scripts_dir: scripts

# 本阶段 build.sh 默认跳过完整 GPU/pip；目标机执行 prefix_install_script。
skip_prefix_install_in_build: true
delivery: zip_and_systemd
delivery_note: 主交付为 zip + systemd；不以 Docker 为主路径。
